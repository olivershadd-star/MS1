name: Diagnostic
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - run: cmake --build build --config Release --target Diag --parallel
      - name: Mesures
        shell: bash
        run: |
          f=$(find build -name Diag.exe | head -1)
          "$f" | tee diag.txt
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic
          path: diag.txt
