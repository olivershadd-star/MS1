name: Preset check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - run: cmake --build build --config Release --target PresetCheck --parallel
      - name: Mesure
        shell: bash
        run: |
          f=$(find build -name PresetCheck.exe | head -1)
          "$f" | tee report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: preset-report
          path: report.txt
