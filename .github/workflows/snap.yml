name: Snapshots
on:
  workflow_dispatch:
jobs:
  snap:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - run: cmake --build build --config Release --target Snapshot --parallel
      - name: Capture
        shell: bash
        run: |
          mkdir out && cd out
          f=$(find ../build -name Snapshot.exe | head -1)
          "$f"
      - name: Dump base64
        shell: bash
        run: |
          for f in out/*.png; do echo "BEGIN64 $(basename $f)"; base64 -w 200 "$f"; echo "END64"; done
      - uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: out/*.png
